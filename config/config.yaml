env:
  loglevel: ${ENV_LOGLEVEL}

grpc:
  port: ${GRPC_PORT}
  host: ${GRPC_HOST}

http:
  port: ${HTTP_PORT}
  host: ${HTTP_HOST}
  timeout: ${HTTP_TIMEOUT}

postgres:
  username: ${POSTGRESQL_USER}
  password: ${POSTGRES_PASSWORD}
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  dbName: ${POSTGRES_DB}
