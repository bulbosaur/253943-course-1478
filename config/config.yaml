env:
  loglevel: ${ENV_LOGLEVEL}

grpc:
  port: ${GRPC_PORT}
  host: ${GRPC_HOST}

http:
  port: ${HTTP_PORT}
  host: ${HTTP_HOST}
  timeout: ${HTTP_TIMEOUT}

postgres:
  username: ${POSTGRESQL_USER}
  password: ${POSTGRES_PASSWORD}
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  dbName: ${POSTGRES_DB}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: ${REDIS_DB}
  max_retries: ${REDIS_MAX_RETRIES}
  dial_timeout: ${REDIS_DIAL_TIMEOUT}
  timeout: ${REDIS_TIMEOUT}
